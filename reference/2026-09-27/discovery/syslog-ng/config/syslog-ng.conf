@version: 3.38
@include "scl.conf"
@include "/etc/syslog-ng/conf.d/*.conf"


# ============================================================
# SORGENTE
# Ricezione Syslog MikroTik UDP/TCP porta 5514
# ============================================================

source s_network {
    syslog(
        ip(0.0.0.0)
        port(5514)
        transport("udp")
    );

    syslog(
        ip(0.0.0.0)
        port(5514)
        transport("tcp")
    );
};


# ============================================================
# PARSER CONNESSIONI MIKROTIK
#
# Esempi gestiti:
#
# proto UDP, 10.31.7.10:12345->8.8.8.8:53
#
# proto TCP (SYN), 10.31.7.10:12345->1.2.3.4:443
#
# Vengono estratti:
# NET_PROTO
# NET_SRCIP
# NET_SRCPORT
# NET_DSTIP
# NET_DSTPORT
# ============================================================

parser p_network_parser {

    regexp-parser(
        patterns(
            "proto (?<NET_PROTO>[A-Z]+)(?: \\([^)]*\\))?, (?<NET_SRCIP>[0-9\\.]+):(?<NET_SRCPORT>[0-9]+)->(?<NET_DSTIP>[0-9\\.]+):(?<NET_DSTPORT>[0-9]+)"
        )
    );


    # --------------------------------------------------------
    # PARSER SNAT
    #
    # Esempio MikroTik:
    #
    # NAT (10.31.3.51:49151->185.198.209.34:49151)
    #     ->54.216.172.252:1789
    #
    # Estrae:
    # NET_NATIP   = 185.198.209.34
    # NET_NATPORT = 49151
    #
    # Il formato DNAT viene volutamente ignorato.
    # --------------------------------------------------------

    regexp-parser(
        patterns(
            "connection-state:[^ ]*,snat .*NAT \\([0-9\\.]+:[0-9]+->(?<NET_NATIP>[0-9\\.]+):(?<NET_NATPORT>[0-9]+)\\)->"
        )
    );
};


# ============================================================
# FILE DI LOG LEGGIBILE
# ============================================================

destination d_network_logs {

    file(
        "/var/log/network.log"

        owner("root")
        group("netlog")
        perm(0640)

        template(
            "${ISODATE} PROTO: ${NET_PROTO}, SRC: ${NET_SRCIP}:${NET_SRCPORT}, NAT: ${NET_NATIP}:${NET_NATPORT}, DST: ${NET_DSTIP}:${NET_DSTPORT}\n"
        )

        template-escape(no)
    );
};


# ============================================================
# FILTRO
# Accetta solamente messaggi contenenti "proto "
# ============================================================

filter f_valid_logs {
    match("proto " value("MESSAGE"));
};


# ============================================================
# MYSQL
# Una tabella per ogni giorno:
#
# mikrotik_logs_YYYY_MM_DD
# ============================================================

destination d_mysql {

    sql(
        type(mysql)

        host("localhost")
        username("netlog_ingest")
        password("***REDACTED***")
        database("syslogdb")

        table("mikrotik_logs_${YEAR}_${MONTH}_${DAY}")

        columns(
            "timestamp",
            "source_ip",
            "source_port",
            "dest_ip",
            "dest_port",
            "protocol",
            "nat_source_ip",
            "nat_source_port"
        )

        values(
            "${S_YEAR}-${S_MONTH}-${S_DAY} ${S_HOUR}:${S_MIN}:${S_SEC}",
            "${NET_SRCIP}",
            "${NET_SRCPORT}",
            "${NET_DSTIP}",
            "${NET_DSTPORT}",
            "${NET_PROTO}",
            "${NET_NATIP}",
            "${NET_NATPORT}"
        )

        session-statements("SET SESSION sql_mode=''")

        log-fifo-size(10000)
        batch-lines(1)
        frac-digits(3)
    );
};



# ============================================================
# LOG PATH
# ============================================================

log {
    source(s_network);
    parser(p_network_parser);
    filter(f_valid_logs);
    destination(d_network_logs);
    destination(d_mysql);
};